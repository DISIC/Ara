name: E2E
on:
  pull_request:
    branches: [main]

jobs:
  cypress:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: db-user
          POSTGRES_PASSWORD: db-password
          POSTGRES_DB: confiture-db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025"]
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

    env:
      DATABASE_URL: postgres://db-user:db-password@localhost:5432/confiture-db
      DATABASE_SSL: false
      TESTS_ENDPOINTS: 1
      JWT_SECRET: test
      FRONT_BASE_URL: http://localhost:3000
      MAILER_USER: test@example.com
      MAILER_PASSWORD: test
      MAILER_SMTP_HOST: localhost
      MAILER_SMTP_PORT: 1025
      MAILER_SMTP_SECURE: false
      GRIST_API_KEY: test
      GRIST_DOC_ID: test
      GRIST_TABLE_ID: test
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_VIRTUAL_HOST: ${{ secrets.S3_VIRTUAL_HOST }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      - name: Generate prisma client and API types
        run: yarn copytypes

      - name: Generate RGAA files
        run: yarn workspace confiture-web-app run generate:rgaa

      - name: Apply migrations
        run: yarn workspace confiture-rest-api run migrate:prod

      - name: Build back
        run: yarn workspace confiture-rest-api run build

      - name: Launch back (port 4000)
        run: yarn workspace confiture-rest-api run start:prod > back.log 2>&1 &

      - name: Launch front (port 3000)
        run: yarn workspace confiture-web-app run dev > front.log 2>&1 &

      - name: Waiting front & back launched
        run: npx wait-on http://localhost:3000 http://localhost:4000/api/healthcheck --timeout 120000

      - name: Launch cypress tests
        run: yarn tests:run

      - name: Display logs if it fails
        if: failure()
        run: |
          echo "--- back.log ---" && cat back.log || true
          echo "--- front.log ---" && cat front.log || true

      - name: Save screenshots if it fails
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
